name: Bug report
description: A correction misbehaved, or something crashed
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy rule:** never paste real Slack messages. Invent a *synthetic*
        sentence that shows the same problem. Reports containing real message
        content will be edited or closed.

        **Using an AI assistant to file this?** Great — but the useful output is
        verifiable artifacts, not prose. Give it this prompt:

        > You are helping file a bug against slack-grammar (a local grammar
        > checker for Slack). First read
        > https://github.com/timrichardson/slack-grammar/llms.txt and AGENTS.md
        > (especially the hard rules: minimal edits, chat-style preservation —
        > no added final periods, no re-capitalized sentences; synthetic text
        > only). Then produce: (1) a SYNTHETIC input sentence triggering the
        > bug — never quote real messages; (2) the exact output the tool
        > produced, and the expected output under those rules; (3) one JSONL
        > eval-corpus line (fields: id, tag, want, input, accept[]) that would
        > currently FAIL `bun run eval`; (4) the exact commands a human should
        > run to confirm, and what to look for. Report only observed behavior —
        > no speculation.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Correction quality (wrong / missed / over-aggressive fix)
        - Suggestion card / UI in Slack
        - Daemon, injector, or gateway
        - Install / setup / systemd
        - Performance / latency
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: One or two sentences, observed behavior only.
      placeholder: "Corrected 'X' to 'Y' but should have been 'Z' / no widget appeared / daemon exited…"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Does it reproduce?
      description: >-
        Checks are deterministic at temperature 0 — "sometimes" usually points
        to a caching or timing issue, which is a useful clue in itself.
      options:
        - Every time
        - Sometimes
        - Once, haven't retried
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Environment — paste `slack-grammar doctor` output
      description: Verifiable environment fingerprint; also covers versions.
      render: shell
      placeholder: |
        ✓ vulkan: …
        ✓ llama-server binary: …
        …
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction — synthetic input, actual output, expected output
      description: |
        Copy the exact strings. Expected output must respect the project's
        rules: minimal edits, chat style preserved (no added periods, no
        re-capitalized sentences).
      placeholder: |
        input:    we should of tested it first
        actual:   we should have tested it first.   (added a period)
        expected: we should have tested it first
    validations:
      required: true

  - type: textarea
    id: corpus-case
    attributes:
      label: Reproducing test (drop-in eval corpus case)
      description: |
        Optional but hugely appreciated — one JSONL line in the format of
        `eval/corpus.jsonl`. If provided, the maintainer can paste it into the
        corpus and see the failure with `bun run eval`.
      render: json
      placeholder: |
        {"id":"sugg1","tag":"should-of","want":"fix","input":"…","accept":["…"]}

  - type: dropdown
    id: ai-usage
    attributes:
      label: Did you use an AI assistant to investigate or write this report?
      options:
        - "No"
        - "Yes — I verified everything below myself"
        - "Yes — partially verified"
    validations:
      required: true

  - type: textarea
    id: verified
    attributes:
      label: What did you verify yourself?
      description: |
        Which commands did you run and what did you see? (e.g. "ran
        `slack-grammar doctor`, all green; typed the input in Slack, widget
        appeared with the output above"). Concrete steps only.
      placeholder: "I ran … and saw …"
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy attestation
      options:
        - label: The input above is synthetic — it contains no real message content from any workspace.
          required: true
