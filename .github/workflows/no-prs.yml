name: no-prs

# This project does not accept external pull requests (see CONTRIBUTING.md).
# Primary enforcement is the repository interaction limit (collaborators_only),
# but that expires after at most six months — this workflow is the permanent
# net: any PR opened by a non-collaborator is closed immediately with a note.
# Maintainer: renew the interaction limit with
#   gh api -X PUT repos/timrichardson/slack-grammar/interaction-limits \
#     -f limit=collaborators_only -f expiry=six_months
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.author_association != 'COLLABORATOR' && github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request
        run: |
          gh pr close "$NUMBER" --repo "$REPO" --comment "Thanks for your interest! This project is not accepting external pull requests at the moment — see CONTRIBUTING.md. Security issues can still be reported privately via the Security tab."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
